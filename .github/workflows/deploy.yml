name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # allows pushing to ghcr.io
  id-token: write   # required for OIDC login to Azure

env:
  # Image name must be lowercase; AZURE_APP_NAME should be 'scorm-generator'
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.AZURE_APP_NAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with both the commit SHA (immutable) and 'latest' (for manual pulls)
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure and deploy
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters @infra/main.bicepparam \
            --parameters containerImage="${{ env.IMAGE }}:${{ github.sha }}" \
            --parameters registryUsername="${{ github.repository_owner }}" \
            --parameters registryPassword="${{ secrets.GHCR_TOKEN }}" \
            --mode Incremental
